name: images

# Building needs no GPU, so CI can prove that every backend's Dockerfile still
# works even though only one of them has hardware behind it here. That turns
# "untested" into the narrower and more honest "builds, inference unverified".
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One broken backend should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - backend: xpu
            base: intel/pytorch:xpu-2.11.0-ubuntu24.04
            venv: /opt/venv
            torch: ""
          - backend: cuda
            base: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-runtime
            venv: /opt/conda
            torch: ""
          - backend: cpu
            base: python:3.12-slim
            venv: /usr
            torch: "--index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchvision==0.22.1"

    steps:
      - uses: actions/checkout@v4

      # The CUDA and XPU bases are several gigabytes before anything is
      # installed on top; a stock runner does not have room for them next to
      # its preinstalled toolchains.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        # Pull requests from forks get no credentials, so they build and throw
        # the result away rather than failing on a push they cannot make.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # :cuda is the moving latest for that backend, :cuda-<sha> and
          # :cuda-<version> are the ones to pin to.
          tags: |
            type=raw,value=${{ matrix.backend }}
            type=sha,prefix=${{ matrix.backend }}-,format=short
            type=semver,pattern={{version}},prefix=${{ matrix.backend }}-

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./container
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            VENV_PATH=${{ matrix.venv }}
            TORCH_INSTALL=${{ matrix.torch }}
          cache-from: type=gha,scope=${{ matrix.backend }}
          cache-to: type=gha,scope=${{ matrix.backend }},mode=max

      # Proves the interpreter that owns torch is the one the container uses -
      # the thing VENV_PATH exists to get right, and the thing that silently
      # breaks when a base image moves its Python.
      - name: Smoke test
        run: |
          IMG=$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -1)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "built without pushing; nothing to pull back for a smoke test"
            exit 0
          fi
          # -w /opt/nunif because that is where iw3 lives; the app puts it on
          # sys.path at import time, a bare python3 does not.
          docker run --rm -w /opt/nunif --entrypoint python3 "$IMG" -c "
          import sys, torch, iw3.utils
          print('python  ', sys.executable)
          print('torch   ', torch.__version__)
          print('parser  ', 'ok' if iw3.utils.create_parser(required_true=False) else 'broken')
          "
